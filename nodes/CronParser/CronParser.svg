<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Clock face -->
  <circle cx="50" cy="50" r="35" fill="white" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Clock center dot -->
  <circle cx="50" cy="50" r="3" fill="#2E5C8A"/>
  
  <!-- Hour hand (pointing to 3) -->
  <line x1="50" y1="50" x2="65" y2="50" stroke="#2E5C8A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Minute hand (pointing to 12) -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Hour markers -->
  <circle cx="50" cy="20" r="2" fill="#2E5C8A"/>
  <circle cx="50" cy="80" r="2" fill="#2E5C8A"/>
  <circle cx="20" cy="50" r="2" fill="#2E5C8A"/>
  <circle cx="80" cy="50" r="2" fill="#2E5C8A"/>
  
  <!-- Asterisk symbols (cron representation) -->
  <text x="50" y="95" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle">* * *</text>
</svg>
